name: "🐞 Bug Report"
description: "버그나 문제를 보고합니다."
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: 어떻게 동작해야 하나요?

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷
      placeholder: 선택 사항